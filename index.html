<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepPro - Gamified Prep</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-full flex overflow-hidden text-slate-800">

    <!-- 1. Mandatory Landing / Login Screen (Default view before auth) -->
    <div id="login-view" class="fixed inset-0 z-[200] bg-slate-900 flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-2xl flex flex-col items-center animate-pop">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
                <i class="ph-fill ph-student text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">PrepPro</h1>
            <p class="text-slate-500 text-sm mt-2 mb-8 leading-relaxed">
                Organize learning paths, master flashcards, and track your accuracy history across custom question sets.
            </p>
            
            <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 px-6 py-4 bg-white border-2 border-slate-200 text-slate-800 font-bold rounded-2xl hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm active:scale-95 group">
                <i class="ph-bold ph-google-logo text-blue-600 text-2xl group-hover:scale-110 transition-transform"></i>
                <span>Continue with Google</span>
            </button>
            
            <div id="auth-status" class="mt-4 text-xs font-semibold text-slate-400 min-h-[1rem]"></div>
        </div>
    </div>

    <!-- 2. Main App Screen (Revealed once logged in) -->
    <div id="app-view" class="hidden h-screen w-full flex overflow-hidden">
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden transition-opacity" onclick="app.toggleSidebar(false)"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 flex flex-col shadow-xl md:shadow-none">
            <div class="flex items-center justify-between p-4 border-b border-slate-100">
                <h1 class="text-xl font-extrabold text-blue-600 flex items-center gap-2">
                    <div class="p-1.5 bg-blue-600 rounded-lg"><i class="ph-fill ph-student text-white text-xl"></i></div>
                    PrepPro
                </h1>
                <button onclick="app.toggleSidebar(false)" class="md:hidden p-2 text-slate-400 hover:bg-slate-100 rounded-lg">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            
            <nav class="p-4 space-y-2 flex-1">
                <button onclick="app.setView('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all bg-blue-50 text-blue-700">
                    <i class="ph-fill ph-map-trifold text-xl"></i> Learning Path
                </button>
                <button onclick="app.setView('analytics')" id="nav-analytics" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all text-slate-600 hover:bg-slate-50">
                    <i class="ph-fill ph-chart-line-up text-xl"></i> Analytics
                </button>
            </nav>

            <!-- User Auth Profile Area -->
            <div id="user-auth-area" class="p-4 border-t border-slate-100 mt-auto min-h-[70px] flex items-center"></div>

            <div class="p-4 border-t border-slate-100 space-y-3">
                <div class="flex items-center justify-between px-2 text-sm font-semibold text-slate-500 mb-2">
                    <span>Mode</span>
                    <span id="mode-badge" class="px-2 py-0.5 rounded text-xs bg-slate-100 text-slate-600">Learner</span>
                </div>
                <button onclick="app.toggleMode()" id="mode-toggle-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 text-white font-medium rounded-xl hover:bg-slate-700 transition-all shadow-md active:scale-95">
                    <i class="ph-bold ph-pencil-simple"></i> Switch to Creator
                </button>
                <button onclick="app.resetAllData()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm text-red-500 hover:bg-red-50 rounded-xl transition-all font-medium">
                    <i class="ph-bold ph-trash"></i> Reset All Data
                </button>
            </div>
        </aside>

        <!-- Main Content Panel -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
            <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 sticky top-0 z-30 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="app.toggleSidebar(true)" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                        <i class="ph ph-list text-2xl"></i>
                    </button>
                    <div id="back-btn-container" class="hidden">
                        <button onclick="app.goBack()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium transition-all">
                            <i class="ph-bold ph-arrow-left"></i> Back
                        </button>
                    </div>
                    <h2 id="header-title" class="hidden sm:block font-bold text-slate-800 ml-2"></h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="px-3 py-1.5 bg-yellow-100 text-yellow-700 rounded-lg font-bold flex items-center gap-2 shadow-inner">
                        <i class="ph-fill ph-lightning text-lg"></i> <span id="header-xp">0 XP</span>
                    </div>
                </div>
            </header>

            <div id="view-container" class="flex-1 overflow-y-auto w-full relative p-4 sm:p-8 pb-24"></div>
        </main>
    </div>

    <!-- Modals & Action Sheet -->
    <div id="modal-container" class="fixed inset-0 z-[100] hidden flex items-center justify-center modal-backdrop bg-slate-900/50 p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]"></div>
    </div>

    <div id="action-sheet" class="fixed inset-0 z-[90] hidden flex items-end sm:items-center justify-center modal-backdrop bg-slate-900/40 p-4 transition-opacity">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-pop">
            <div class="p-6 text-center border-b border-slate-100">
                <h3 id="action-sheet-title" class="text-xl font-bold text-slate-800">Subtopic</h3>
                <p class="text-slate-500 text-sm mt-1">Choose what to study</p>
            </div>
            <div class="p-4 space-y-3 bg-slate-50" id="action-sheet-content"></div>
            <div class="p-4 bg-white">
                <button onclick="document.getElementById('action-sheet').classList.add('hidden')" class="w-full py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl transform transition-all duration-300 translate-y-20 opacity-0 pointer-events-none z-[300] font-medium flex items-center gap-3">
        <div id="toast-icon"><i class="ph-fill ph-info text-blue-400 text-xl"></i></div>
        <span id="toast-message">Notification</span>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
    
    <!-- Firebase Authentication & Cloud Sync -->
    <script type="module" src="firebase-auth.js"></script>
</body>
</html>
